<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>База активов JITL</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}

  .header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);color:white;padding:24px 24px 18px;box-shadow:0 4px 20px rgba(0,0,0,.3)}
  .header h1{font-size:24px;font-weight:700;margin-bottom:3px}
  .header p{font-size:12px;opacity:.7}

  .controls{background:white;padding:14px 20px;box-shadow:0 2px 8px rgba(0,0,0,.08);position:sticky;top:0;z-index:100}

  .search-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  #search,.source-input{flex:1;min-width:200px;padding:9px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none;transition:border-color .2s;background:#fafafa}
  #search:focus,.source-input:focus{border-color:#0f3460;background:white}
  .source-input.active{border-color:#0f3460;background:#eff6ff}

  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:flex-start}

  .filter-block{display:flex;flex-direction:column;gap:3px}
  .filter-label{font-size:10px;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:.4px}

  select{padding:6px 10px;border:2px solid #e2e8f0;border-radius:8px;font-size:12px;outline:none;cursor:pointer;background:white;color:#1a1a2e;transition:border-color .2s;max-width:190px}
  select:focus{border-color:#0f3460}
  select.active{border-color:#0f3460;background:#eff6ff}

  .reset-btn{padding:7px 12px;background:#f1f5f9;border:2px solid #e2e8f0;border-radius:8px;font-size:12px;cursor:pointer;color:#475569;transition:all .2s;white-space:nowrap;align-self:flex-end}
  .reset-btn:hover{background:#e2e8f0}

  /* Мультивыбор назначения */
  .efficacy-filter{position:relative}
  .efficacy-btn{padding:6px 10px;border:2px solid #e2e8f0;border-radius:8px;font-size:12px;cursor:pointer;background:white;color:#1a1a2e;white-space:nowrap;display:flex;align-items:center;gap:5px;transition:border-color .2s}
  .efficacy-btn.active{border-color:#0f3460;background:#eff6ff}
  .efficacy-dropdown{display:none;position:absolute;top:calc(100% + 4px);left:0;background:white;border:2px solid #e2e8f0;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:200;min-width:260px;max-height:320px;overflow-y:auto}
  .efficacy-dropdown.open{display:block}
  .efficacy-option{padding:7px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12px;transition:background .15s}
  .efficacy-option:hover{background:#f8fafc}
  .efficacy-option input[type=checkbox]{cursor:pointer;width:14px;height:14px}
  .efficacy-option.checked{background:#eff6ff;font-weight:600}

  .results-info{padding:10px 20px 4px;font-size:12px;color:#64748b;font-weight:500}
  .results-info span{color:#0f3460;font-weight:700}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;padding:6px 20px 20px}

  .card{background:white;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.07);overflow:hidden;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.11)}

  .card-header{padding:14px 16px 8px;border-bottom:1px solid #f1f5f9}
  .card-title{font-size:15px;font-weight:700;color:#1a1a2e;margin-bottom:5px;line-height:1.3}

  .tags{display:flex;gap:4px;flex-wrap:wrap}
  .tag{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:.2px}
  .tag-group{background:#ede9fe;color:#5b21b6}
  .tag-supplier{background:#dbeafe;color:#1d4ed8}
  .tag-app{background:#fef3c7;color:#b45309}
  .tag-cosmos{background:#d1fae5;color:#065f46}
  .tag-origin{background:#f1f5f9;color:#475569}

  .card-body{padding:10px 16px;flex:1}
  .inci-block{background:#f8fafc;border-left:3px solid #cbd5e1;padding:5px 9px;border-radius:0 5px 5px 0;margin-bottom:8px;font-size:11px;color:#475569;font-style:italic;line-height:1.5;word-break:break-word}
  .info-row{display:flex;gap:4px;margin-bottom:5px;font-size:12px;align-items:flex-start}
  .info-label{color:#94a3b8;font-weight:600;white-space:nowrap;min-width:72px;font-size:11px;padding-top:1px}
  .info-value{color:#334155;line-height:1.4}
  .dosage-badge{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0;padding:1px 7px;border-radius:5px;font-weight:700;font-size:11px;display:inline-block}

  /* Efficacy tags */
  .efficacy-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
  .etag{padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;background:#fef3c7;color:#92400e;border:1px solid #fde68a}

  /* Origin */
  .origin-row{font-size:11px;color:#64748b;margin-top:5px;display:flex;align-items:flex-start;gap:4px}
  .origin-icon{flex-shrink:0}

  .efficacy-toggle{width:100%;background:none;border:none;border-top:1px solid #f1f5f9;padding:8px 16px;text-align:left;font-size:11px;color:#0f3460;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:5px;transition:background .15s}
  .efficacy-toggle:hover{background:#f8fafc}
  .efficacy-toggle .arrow{font-size:9px;transition:transform .2s}
  .efficacy-toggle.open .arrow{transform:rotate(90deg)}
  .efficacy-content{display:none;padding:9px 16px 12px;font-size:11.5px;color:#475569;line-height:1.6;border-top:1px solid #f1f5f9;background:#fafafa}
  .efficacy-content.open{display:block}

  .no-results{text-align:center;padding:50px 20px;color:#94a3b8;grid-column:1/-1}
  .no-results h3{font-size:18px;margin-bottom:6px;color:#64748b}

  @media(max-width:600px){
    .grid{grid-template-columns:1fr;padding:6px 10px 16px}
    .controls{padding:10px}
    .header{padding:16px 14px}
  }
</style>
</head>
<body>

<div class="header">
  <h1>🧪 База косметических активов JITL</h1>
  <p>Поиск и фильтрация ингредиентов по поставщикам</p>
</div>

<div class="controls">
  <div class="search-row">
    <input type="text" id="search" placeholder="🔍  Поиск по названию, INCI, функции, источнику..." oninput="applyFilters()">
    <button class="reset-btn" onclick="resetAll()">✕ Сбросить</button>
  </div>
  <div class="filters">

    <div class="filter-block">
      <span class="filter-label">Применение</span>
      <select id="fApp" onchange="applyFilters()">
        <option value="">Все</option>
        <option value="кожа">Кожа</option>
        <option value="волосы">Волосы</option>
        <option value="кожа+волосы">Кожа + Волосы</option>
      </select>
    </div>

    <div class="filter-block">
      <span class="filter-label">Группа актива</span>
      <select id="fGroup" onchange="applyFilters()"></select>
    </div>

    <div class="filter-block efficacy-filter" id="efficacyFilter">
      <span class="filter-label">Назначение</span>
      <button class="efficacy-btn" id="efficacyBtn" onclick="toggleEfficacyDropdown(event)">
        <span id="efficacyBtnLabel">Все назначения</span> ▾
      </button>
      <div class="efficacy-dropdown" id="efficacyDropdown"></div>
    </div>

    <div class="filter-block">
      <span class="filter-label">Происхождение</span>
      <select id="fOrigin" onchange="applyFilters()">
        <option value="">Все</option>
        <option value="натуральный">Натуральный</option>
        <option value="биотехнологический">Биотехнологический</option>
        <option value="полусинтетический">Полусинтетический</option>
        <option value="синтетический">Синтетический</option>
      </select>
    </div>

    <div class="filter-block">
      <span class="filter-label">COSMOS</span>
      <select id="fCosmos" onchange="applyFilters()">
        <option value="">Все</option>
        <option value="yes">✓ Одобрен</option>
        <option value="no">✗ Нет</option>
        <option value="unknown">? Неизвестно</option>
      </select>
    </div>

    <div class="filter-block">
      <span class="filter-label">Источник</span>
      <input class="source-input" type="text" id="fSource" placeholder="Растение / животное / ферментация" oninput="applyFilters()">
    </div>

    <div class="filter-block">
      <span class="filter-label">Поставщик</span>
      <select id="fSupplier" onchange="applyFilters()"></select>
    </div>

  </div>
</div>

<div class="results-info" id="resultsInfo"></div>
<div class="grid" id="grid"></div>

let selectedEfficacy = new Set();

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function populateFilters() {
  const groups = [...new Set(DATA.map(p=>p.product_group).filter(Boolean))].sort();
  const suppliers = [...new Set(DATA.map(p=>p.supplier).filter(Boolean))].sort();
  const allTags = new Set();
  DATA.forEach(p=>(p.efficacy_tags||[]).forEach(t=>allTags.add(t)));

  document.getElementById('fGroup').innerHTML =
    '<option value="">Все группы</option>' +
    groups.map(g=>`<option value="${escHtml(g)}">${escHtml(g)}</option>`).join('');

  document.getElementById('fSupplier').innerHTML =
    '<option value="">Все поставщики</option>' +
    suppliers.map(s=>`<option value="${escHtml(s)}">${escHtml(s)}</option>`).join('');

  const dd = document.getElementById('efficacyDropdown');
  dd.innerHTML = [...allTags].sort().map(tag => `
    <label class="efficacy-option" id="eo_${escHtml(tag)}">
      <input type="checkbox" value="${escHtml(tag)}" onchange="onEfficacyChange(this)">
      ${escHtml(tag)}
    </label>`).join('');
}

function toggleEfficacyDropdown(e) {
  e.stopPropagation();
  document.getElementById('efficacyDropdown').classList.toggle('open');
}
document.addEventListener('click', ()=>document.getElementById('efficacyDropdown').classList.remove('open'));

function onEfficacyChange(cb) {
  if(cb.checked) selectedEfficacy.add(cb.value);
  else selectedEfficacy.delete(cb.value);
  const btn = document.getElementById('efficacyBtn');
  const lbl = document.getElementById('efficacyBtnLabel');
  if(selectedEfficacy.size===0){lbl.textContent='Все назначения';btn.classList.remove('active');}
  else{lbl.textContent=selectedEfficacy.size+' выбрано';btn.classList.add('active');}
  document.querySelectorAll('.efficacy-option').forEach(el=>{
    const v=el.querySelector('input').value;
    el.classList.toggle('checked', selectedEfficacy.has(v));
  });
  applyFilters();
}

  'натуральный': ['natural','plant-derived','plant derived'],
};

function normalizeText(s) {
  return String(s||'')
    .toLowerCase()
    .replace(/ё/g,'е')
    .replace(/[‐‑‒–—−]/g,'-')
    .replace(/[®™©]/g,'')
    .replace(/[\u00a0\s]+/g,' ')
    .trim();
}

function expandQuery(q) {
  const base = normalizeText(q);
  if(!base) return [];
  const terms = new Set([base]);
  Object.entries(SEARCH_SYNONYMS).forEach(([key, vals]) => {
    const isPhrase = key.includes(' ');
    const words = base.split(' ');
    if(base===key || words.includes(key) || (isPhrase && base.includes(key)) || key.includes(base)) {
      vals.forEach(v=>terms.add(normalizeText(v)));
    }
  });
  if(base.endsWith('ы')) terms.add(base.slice(0,-1) + 'а');
  return [...terms].filter(Boolean);
}

function buildSearchText(p) {
  return normalizeText([
    p.trade_name,p.manufacturer,p.supplier,p.inci,p.application,
    p.function,p.efficacy,p.dosage,p.product_group,p.source_file,
    (p.source_files||[]).join(' '),p.origin_type,p.source_origin,
    (p.efficacy_tags||[]).join(' ')
  ].join(' '));
}

function applyFilters() {
  const q = document.getElementById('search').value;
  const queryTerms = expandQuery(q);
  const app = document.getElementById('fApp').value;
  const grp = document.getElementById('fGroup').value;
  const origin = document.getElementById('fOrigin').value;
  const cosmos = document.getElementById('fCosmos').value;
  const source = normalizeText(document.getElementById('fSource').value);
  const sup = document.getElementById('fSupplier').value;

  // Mark selects active
  ['fApp','fGroup','fOrigin','fCosmos','fSupplier'].forEach(id=>{
    const el=document.getElementById(id);
    el.classList.toggle('active', el.value!=='');
  });
  document.getElementById('fSource').classList.toggle('active', source!=='');

  const filtered = DATA.filter(p => {
    if(app==='кожа' && !['кожа','кожа+волосы'].includes(p.application)) return false;
    if(app==='волосы' && !['волосы','кожа+волосы'].includes(p.application)) return false;
    if(app==='кожа+волосы' && p.application!=='кожа+волосы') return false;
    if(grp && p.product_group!==grp) return false;
    if(origin && p.origin_type!==origin) return false;
    if(sup && p.supplier!==sup) return false;
    if(source && !normalizeText(p.source_origin).includes(source)) return false;
    if(cosmos==='yes' && p.cosmos_approved!==true) return false;
    if(cosmos==='no' && p.cosmos_approved!==false) return false;
    if(cosmos==='unknown' && p.cosmos_approved!==null) return false;
    if(selectedEfficacy.size>0) {
      const tags = p.efficacy_tags||[];
      if(![...selectedEfficacy].some(t=>tags.includes(t))) return false;
    }
    if(queryTerms.length) {
      const hay = buildSearchText(p);
      if(!queryTerms.some(term=>hay.includes(term))) return false;
    }
    return true;
  });

  renderCards(filtered);
  document.getElementById('resultsInfo').innerHTML =
    `Найдено: <span>${filtered.length}</span> из ${DATA.length} продуктов`;
}

function cosmosLabel(v) {
  if(v===true) return '<span class="tag tag-cosmos">✓ COSMOS</span>';
  if(v===false) return '';
  return '';
}

function originLabel(v) {
  const icons={'натуральный':'🌿','биотехнологический':'🔬','полусинтетический':'⚗️','синтетический':'🧪'};
  return icons[v]||'';
}

function renderCards(products) {
  const grid = document.getElementById('grid');
  if(!products.length) {
    grid.innerHTML='<div class="no-results"><h3>Ничего не найдено</h3><p>Измените параметры поиска</p></div>';
    return;
  }
  grid.innerHTML = products.map(p => {
    const hasDosage = p.dosage&&p.dosage.trim();
    const hasEfficacy = p.efficacy&&p.efficacy.trim();
    const hasInci = p.inci&&p.inci.trim();
    const etags = (p.efficacy_tags||[]).map(t=>`<span class="etag">${escHtml(t)}</span>`).join('');
    const cosmos = cosmosLabel(p.cosmos_approved);
    const originIcon = originLabel(p.origin_type);
    const hasOrigin = p.source_origin&&p.source_origin.trim();
    const hasSourceFile = p.source_file&&p.source_file.trim();

    return `
<div class="card">
  <div class="card-header">
    <div class="card-title">${escHtml(p.trade_name)}</div>
    <div class="tags">
      ${p.product_group?`<span class="tag tag-group">${escHtml(p.product_group)}</span>`:''}
      ${p.supplier?`<span class="tag tag-supplier">${escHtml(p.supplier)}</span>`:''}
      ${p.manufacturer?`<span class="tag tag-supplier">${escHtml(p.manufacturer)}</span>`:''}
      ${p.application?`<span class="tag tag-app">${escHtml(p.application)}</span>`:''}
      ${cosmos}
      ${p.origin_type?`<span class="tag tag-origin">${originIcon} ${escHtml(p.origin_type)}</span>`:''}
    </div>
  </div>
  <div class="card-body">
    ${hasInci?`<div class="inci-block">${escHtml(p.inci)}</div>`:''}
    ${p.function?`<div class="info-row"><span class="info-label">Функция:</span><span class="info-value">${escHtml(p.function)}</span></div>`:''}
    ${hasDosage?`<div class="info-row"><span class="info-label">Дозировка:</span><span class="info-value"><span class="dosage-badge">${escHtml(p.dosage)}</span></span></div>`:''}
    ${hasOrigin?`<div class="origin-row"><span class="origin-icon">🌱</span><span>${escHtml(p.source_origin)}</span></div>`:''}
    ${hasSourceFile?`<div class="origin-row"><span class="origin-icon">📄</span><span>${escHtml(p.source_file)}</span></div>`:''}
    ${etags?`<div class="efficacy-tags">${etags}</div>`:''}
  </div>
  ${hasEfficacy?`
  <button class="efficacy-toggle" onclick="toggleEff(this)">
    <span class="arrow">▶</span> Эффективность / данные
  </button>
  <div class="efficacy-content">${escHtml(p.efficacy)}</div>`:''}
</div>`;
  }).join('');
}

function toggleEff(btn) {
  btn.classList.toggle('open');
  btn.nextElementSibling.classList.toggle('open');
}

function resetAll() {
  document.getElementById('search').value='';
  document.getElementById('fSource').value='';
  document.getElementById('fSource').classList.remove('active');
  ['fApp','fGroup','fOrigin','fCosmos','fSupplier'].forEach(id=>{
    document.getElementById(id).value='';
    document.getElementById(id).classList.remove('active');
  });
  selectedEfficacy.clear();
  document.getElementById('efficacyBtnLabel').textContent='Все назначения';
  document.getElementById('efficacyBtn').classList.remove('active');
  document.querySelectorAll('.efficacy-option input').forEach(cb=>cb.checked=false);
  document.querySelectorAll('.efficacy-option').forEach(el=>el.classList.remove('checked'));
  applyFilters();
}

populateFilters();
applyFilters();
</script>
